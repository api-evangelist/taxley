aid: taxley

name: Taxley (UK Corporation Tax API)

image: https://taxley.co.uk/images/og/taxley-share-v1.jpg

description: Taxley provides free UK Corporation Tax calculators and a public JSON API for developers and AI assistants. It offers tools to compute
  corporation tax, deadlines, penalties, and related calculations without requiring an API key. Results link back to Taxley’s website for verification.
  The service is operated by Taxley UK LLP, a UK‑registered limited liability partnership, and integrates with HMRC filing processes.

